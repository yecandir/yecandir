name: refresh-stats

# Nightly: rebuild assets/card-{dark,light}.svg from the GitHub GraphQL API and commit.
# METRICS_TOKEN = classic PAT with `repo` + `read:user`, so private contributions
# and private-repo languages are counted.

on:
  schedule:
    - cron: "17 3 * * *"   # 06:17 Europe/Istanbul
  workflow_dispatch:
  push:
    branches: [main]
    paths: [scripts/render_card.py, .github/workflows/refresh-stats.yml]

permissions:
  contents: write

jobs:
  card:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: render card
        env:
          GH_TOKEN: ${{ secrets.METRICS_TOKEN }}
        run: python3 scripts/render_card.py

      - name: commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/
          git diff --cached --quiet && echo "card unchanged" || { git commit -m "stats: refresh card" && git push; }
